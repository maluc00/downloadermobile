name: Compilar Klipr Pocket APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permissão de execução ao Gradle Wrapper
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=2.0.${{ github.run_number }} --stacktrace

      - name: Publicar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Klipr-Pocket-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar GitHub Release (Auto-Update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Klipr Pocket v2.0.${{ github.run_number }}
          body: "Build automático com motor yt-dlp/Aria2c/FFmpeg, 5 Temas e Bottom Sheet Rápido."
          files: app/build/outputs/apk/debug/*.apk
